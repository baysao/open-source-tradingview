# pgsqlite: the owner's fork, installed from ITS OWN release asset instead of a cargo build.
#
# The binary is built and published by pgsqlite's own release workflow
# (baysao/pgsqlite/.github/workflows/release.yml, fired by a v* tag there):
#   pgsqlite-linux-amd64.tar.gz, pgsqlite-linux-arm64.tar.gz, pgsqlite-windows-amd64.zip, ...
# pgsqlite's mise.toml pins the same assets for its own repo; this file is the consumer side, so
# the app repo's dev flow can install the binary without cloning the fork.
#
#   mise install pgsqlite
#   PGSQLITE_BIN="$(mise which pgsqlite)" bash scripts/dev.sh dev
#
# `version` is the pgsqlite release tag without its leading "v". A version bump = tag a new
# pgsqlite release, then raise this line. If the asset is missing (404), the release for that tag
# has not been published yet: check `gh release list --repo baysao/pgsqlite`.
#
# Why not in mise.toml: only the dev box and the VPS need pgsqlite, and a 404 there would block
# every `mise run` task. Load this file with MISE_ENV=pgsqlite where it is wanted.
#
# Docs: https://mise.jdx.dev/dev-tools/backends/http.html

[tools."http:pgsqlite"]
version = "0.0.22"
[tools."http:pgsqlite".platforms]
linux-x64 = { url = "https://github.com/baysao/pgsqlite/releases/download/v{{ version }}/pgsqlite-linux-amd64.tar.gz" }
linux-arm64 = { url = "https://github.com/baysao/pgsqlite/releases/download/v{{ version }}/pgsqlite-linux-arm64.tar.gz" }
macos-x64 = { url = "https://github.com/baysao/pgsqlite/releases/download/v{{ version }}/pgsqlite-macos-intel.tar.gz" }
macos-arm64 = { url = "https://github.com/baysao/pgsqlite/releases/download/v{{ version }}/pgsqlite-macos-apple-silicon.tar.gz" }
windows-x64 = { url = "https://github.com/baysao/pgsqlite/releases/download/v{{ version }}/pgsqlite-windows-amd64.zip" }
# One binary in the archive: `bin` names it, so mise installs it executable at the root.
bin = "pgsqlite"
