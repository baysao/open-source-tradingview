# Publish the production binaries as release assets, so a deploy installs prebuilt artefacts
# instead of building on the VPS (mise.toml [tools."http:vtv"] and mise.mt5.toml
# [tools."http:mt5-bridge"] fetch these URLs).
#
# Trigger: a vX.Y.Z tag. Assets per tag, named exactly as the mise configs expect:
#   vtv-vX.Y.Z-linux-x64.tar.gz          x86_64-unknown-linux-gnu  (hub-server)
#   vtv-vX.Y.Z-linux-arm64.tar.gz        aarch64-unknown-linux-gnu  (hub-server)
#   mt5-bridge-vX.Y.Z-windows-x64.zip    x86_64-pc-windows-msvc    (the required leg: the MT5
#                                        host runs Windows; the exe sits at the archive root)
#   mt5-bridge-vX.Y.Z-linux-x64.tar.gz   x86_64-unknown-linux-gnu  (Wine hosts, best-effort)
#   mt5-bridge-vX.Y.Z-linux-arm64.tar.gz aarch64-unknown-linux-gnu (best-effort, untested
#                                        against a real terminal)
#   mt5-manager-vX.Y.Z-windows-x64.zip   (the `manager` job below: the Tauri operator console,
#                                        built from its own workspace with --features gui)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
            bin: hub-server
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            bin: hub-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: windows-x64
            bin: mt5-bridge
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: linux-x64
            bin: mt5-bridge
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: linux-arm64
            bin: mt5-bridge
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.bin }}
      # ring (via rustls) runs a C build script, so the aarch64 target needs the cross linker
      # and gcc, not just the rust target.
      - name: Cross toolchain for arm64
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build the release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release -p ${{ matrix.bin }} --target ${{ matrix.target }}
      - name: "Package (windows: a zip, exe at the archive root)"
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $NAME = "mt5-bridge-v${VERSION}-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$NAME" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mt5-bridge.exe" "dist/$NAME/"
          Compress-Archive -Path "dist/$NAME" -DestinationPath "dist/$NAME.zip"
          $Hash = (Get-FileHash "dist/$NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $NAME.zip" | Set-Content "dist/$NAME.zip.sha256"
          Get-Content "dist/$NAME.zip.sha256"
      - name: "Package (linux: tarballs, binary at the archive root)"
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.bin }}" = "hub-server" ]; then
            NAME="vtv-v${VERSION}-linux-${{ matrix.arch }}"
          else
            NAME="mt5-bridge-v${VERSION}-linux-${{ matrix.arch }}"
          fi
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          sha256sum "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"
          cat "dist/${NAME}.tar.gz.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            NAME="mt5-bridge-v${VERSION}-windows-x64"
            FILES="dist/${NAME}.zip dist/${NAME}.zip.sha256"
          elif [ "${{ matrix.bin }}" = "hub-server" ]; then
            NAME="vtv-v${VERSION}-linux-${{ matrix.arch }}"
            FILES="dist/${NAME}.tar.gz dist/${NAME}.tar.gz.sha256"
          else
            NAME="mt5-bridge-v${VERSION}-linux-${{ matrix.arch }}"
            FILES="dist/${NAME}.tar.gz dist/${NAME}.tar.gz.sha256"
          fi
          # Create the release on the first matrix leg, attach on all.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "vtradingview $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" $FILES --clobber

  # The Tauri manager app: its own workspace (D-030), so the matrix above cannot carry it, and
  # `tauri` is an OPTIONAL dependency behind a non-default `gui` feature (AC-1 of 09-02), so the
  # build must name `--features gui` or it produces a binary that exits 2.
  manager:
    runs-on: windows-latest
    env:
      # Same secrets-only posture as desktop.yml's installers job: an absent certificate is a
      # clean skip, never a red run, and `certificateThumbprint` stays OUT of tauri.conf.json.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: mt5-manager-windows-x64
      - name: Import Windows certificate (skips without a secret)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build the manager (unsigned while Q4 is open)
        working-directory: crates/mt5-manager
        run: cargo tauri build --features gui
      - name: Sign the installer (skips without a secret)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          Get-ChildItem crates\mt5-manager\target\release\bundle\nsis\*.exe | ForEach-Object {
            signtool sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com $_.FullName
          }
      - name: Package (portable zip, exe at the archive root)
        shell: pwsh
        run: |
          $VERSION = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $NAME = "mt5-manager-v${VERSION}-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$NAME" | Out-Null
          Copy-Item "crates/mt5-manager/target/release/mt5-manager.exe" "dist/$NAME/"
          # WebView2Loader.dll is a REQUIRED next-to-the-exe dependency on a `*-windows-gnu`
          # toolchain: webview2-com-sys links it dynamically there and statically only on
          # `target_env = "msvc"` (webview2-com-sys-0.39.1/src/lib.rs:14-24). The exe's import table
          # names it, so without the DLL Windows refuses to start the app (0xC0000135). This leg runs
          # on windows-latest = MSVC, where the link is static and no DLL exists — the copy below is a
          # no-op here and the guard is what protects a GNU-built install (DEBT-048). rust-toolchain.toml
          # pins the msvc triple so a local build matches this leg.
          if (Test-Path "crates/mt5-manager/target/release/WebView2Loader.dll") {
            Copy-Item "crates/mt5-manager/target/release/WebView2Loader.dll" "dist/$NAME/"
            Write-Host "Copied WebView2Loader.dll (a GNU-style dynamic loader link)."
          } else {
            Write-Host "No WebView2Loader.dll (MSVC links the loader statically; nothing to ship)."
          }
          # The NSIS installer beside the portable exe counts as "installer or portable zip"; a
          # Windows host that cannot run an installer still gets a working exe from the zip.
          Get-ChildItem "crates/mt5-manager/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "dist/${NAME}-setup.exe" }
          Compress-Archive -Path "dist/$NAME" -DestinationPath "dist/$NAME.zip"
          $Hash = (Get-FileHash "dist/$NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $NAME.zip" | Set-Content "dist/$NAME.zip.sha256"
          Get-Content "dist/$NAME.zip.sha256"
          # Fail loudly rather than publish an unstartable app: if the build produced a loader DLL,
          # the zip must contain it.
          Add-Type -A System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/$NAME.zip"))
          try { $entries = $z.Entries | Select-Object -ExpandProperty FullName } finally { $z.Dispose() }
          if ((Test-Path "crates/mt5-manager/target/release/WebView2Loader.dll") -and
              -not ($entries -match 'WebView2Loader\.dll$')) {
            throw "WebView2Loader.dll was built but is missing from $NAME.zip; the app would not start"
          }
          $entries
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $VERSION = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $NAME = "mt5-manager-v${VERSION}-windows-x64"
          $FILES = @("dist/${NAME}.zip", "dist/${NAME}.zip.sha256")
          if (Test-Path "dist/${NAME}-setup.exe") { $FILES += "dist/${NAME}-setup.exe" }
          gh release view "$env:GITHUB_REF_NAME" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" --notes "vtradingview $env:GITHUB_REF_NAME"
          }
          gh release upload "$env:GITHUB_REF_NAME" @FILES --clobber
