# The desktop crate is not a root workspace member (D-030), so the root ci.yml never builds it.
# This workflow builds and tests it on every push (no paths filter: a capability widened on a
# commit that never touches the crate still fails the run that introduces it), and a vX.Y.Z tag
# builds unsigned installers while Q4 (code signing) is open.
name: desktop

on:
  push:
    branches: [main, arch/axum-tauri]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-windows:
    # Windows is the job that catches the capability test: that test reads the capability file
    # from the crate root, and the path resolution differs from Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path crates/desktop/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path crates/desktop/Cargo.toml --all-targets -- -D warnings
      # The manager is a SECOND workspace (D-030). Its default feature set is tauri-free by design
      # (AC-1), so this leg proves the domain suite on a machine with no WebView2 runtime.
      - run: cargo test --manifest-path crates/mt5-manager/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path crates/mt5-manager/Cargo.toml --all-targets -- -D warnings

  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The four Tauri v2 system packages. This webkit2gtk cost stays confined to this job;
      # the root ci.yml test job never installs it.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path crates/desktop/Cargo.toml --all-targets
      - run: cargo test --manifest-path crates/mt5-manager/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path crates/mt5-manager/Cargo.toml --all-targets -- -D warnings
      # The gui half cannot be built here (the manager's bundle is Windows-first per 09-ARCHITECTURE
      # decision 7), but the feature must at least resolve: --features gui pulls tauri and
      # tauri-build, and a resolution failure is a defect this leg catches early.
      - run: cargo check --manifest-path crates/mt5-manager/Cargo.toml --features gui

  installers:
    # Unsigned beta while Q4 is open. Adding certificates later is a secrets-only change: the
    # WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD env names are wired below, every signing
    # step is guarded by `if: env.WINDOWS_CERTIFICATE != ''`, so an absent secret is a clean skip,
    # not a red run. Do NOT add certificateThumbprint to tauri.conf.json: with no certificate it
    # fails the build instead of skipping it.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Import Windows certificate (skips without a secret)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build (unsigned while Q4 is open)
        run: cargo tauri build
      - name: Sign the Windows installer (skips without a secret)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          Get-ChildItem target\release\bundle\nsis\*.exe | ForEach-Object {
            signtool sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com $_.FullName
          }
      - name: Collect bundle artefacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then cp target/release/bundle/nsis/*.exe dist/; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then cp target/release/bundle/deb/*.deb dist/; cp target/release/bundle/appimage/*.AppImage dist/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: dist/
      - name: Release notes say the installers are unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes "vtradingview $GITHUB_REF_NAME — unsigned beta installers (Q4 code signing is still open; no certificate yet)"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
