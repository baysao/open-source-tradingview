name: ci

on:
  push:
    branches: [main, arch/axum-tauri]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Without CONTRACT_PY_URL the contract tests skip; the contract job below runs them.
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  contract:
    # G1: the Python hub (oracle, port 8770) and the built hub-server (port 8771) answer the same
    # requests with the same JSON shapes. Upstream outages (for example Bybit refusing data-centre
    # IPs) turn a case into "skip", listed in the job summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cargo build -p hub-server
      - name: Start both servers
        run: |
          mkdir -p "$RUNNER_TEMP/py" "$RUNNER_TEMP/rs-logs"
          nohup python hub/server.py > "$RUNNER_TEMP/py/out.log" 2>&1 &
          HUB_HTTP_PORT=8771 HUB_LOG_DIR="$RUNNER_TEMP/rs-logs" nohup target/debug/hub-server > "$RUNNER_TEMP/rs.log" 2>&1 &
          for port in 8770 8771; do
            for i in $(seq 1 60); do
              curl -fs "http://127.0.0.1:$port/api/status" > /dev/null && break
              sleep 1
            done
            curl -fs "http://127.0.0.1:$port/api/status" || { echo "server on $port did not start"; exit 1; }
            echo
          done
      - name: Contract suite
        env:
          CONTRACT_PY_URL: http://127.0.0.1:8770
          CONTRACT_RS_URL: http://127.0.0.1:8771
        run: |
          set -o pipefail
          cargo test -p hub-core --test contract -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/contract.log"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Contract suite"
            grep -E '^contract: [0-9]+ passed' "$RUNNER_TEMP/contract.log" || echo "no result line"
            echo
            echo "### Skipped cases"
            grep -E '^  skip ' "$RUNNER_TEMP/contract.log" || echo "none"
            echo
            echo "### Failed cases"
            grep -E '^  FAIL ' "$RUNNER_TEMP/contract.log" || echo "none"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Server logs on failure
        if: failure()
        run: |
          tail -50 "$RUNNER_TEMP/py/out.log" || true
          tail -50 "$RUNNER_TEMP/rs.log" || true
