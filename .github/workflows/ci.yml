name: ci

on:
  push:
    branches: [main, arch/axum-tauri]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path crates/desktop/Cargo.toml --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p hub-core --all-targets --features test-idp -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The contract comparison cases hold their recorded shapes (tests/contract/recorded/,
      # the Python oracle's phase-04 replacement); the contract job below also runs the probes
      # against a live hub-server.
      - run: cargo test --workspace

  db:
    # Phase 03: the migration runner and the account schema on both engines (03-01). A missing
    # engine fails here instead of printing SKIPPED (VTV_TEST_REQUIRE).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VTV_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      VTV_TEST_REQUIRE: pgsqlite,postgres
      PGSQLITE_BIN: /home/runner/.cargo/bin/pgsqlite
      PGSQLITE_REV: 5e34b2d2a3e6ca2e9a74a15f723cc942a9a739fc
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # pgsqlite has no release binary for this runner: build the owner's fork at a pinned commit
      # (the dev binary's source branch head on 2026-11-24). Bump the rev to take a pgsqlite fix.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cargo/bin/pgsqlite
          key: pgsqlite-${{ env.PGSQLITE_REV }}
      - run: test -x "$PGSQLITE_BIN" || cargo install --locked --git https://github.com/baysao/pgsqlite --rev "$PGSQLITE_REV" pgsqlite
      - run: cargo test -p hub-core --features test-idp --test db_engines

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      # The test-IdP router mints a token for any `sub`, so a release build must not carry it. The
      # feature is opt-in and hub-server never enables it; `rsa` is its only dependency, and it must
      # be absent from the release tree. Mutate with `--features test-idp` to see this step fail.
      - name: release build excludes test-idp
        run: |
          if cargo tree -p hub-server -e features | grep -q 'rsa v'; then
            echo "test-idp leaked into the release tree"; exit 1
          fi
          echo "release feature tree clean"

  contract:
    # G1, Rust-only since phase 04 retired the Python hub: the built hub-server answers the
    # Rust-only contract cases (the probes) on port 8771. The case comparisons that needed the
    # Python oracle skip with a count (their re-creation against a recorded oracle is future
    # work), listed in the job summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p hub-server
      - name: Start the hub-server
        run: |
          mkdir -p "$RUNNER_TEMP/rs-logs"
          HUB_HTTP_PORT=8771 HUB_LOG_DIR="$RUNNER_TEMP/rs-logs" nohup target/debug/hub-server > "$RUNNER_TEMP/rs.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs "http://127.0.0.1:8771/api/status" > /dev/null && break
            sleep 1
          done
          curl -fs "http://127.0.0.1:8771/api/status" || { echo "server on 8771 did not start"; exit 1; }
      - name: Contract suite
        env:
          CONTRACT_RS_URL: http://127.0.0.1:8771
        run: |
          set -o pipefail
          cargo test -p hub-core --test contract -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/contract.log"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Contract suite"
            grep -E '^contract: [0-9]+ passed' "$RUNNER_TEMP/contract.log" || echo "no result line"
            echo
            echo "### Skipped cases"
            grep -E 'skipped:' "$RUNNER_TEMP/contract.log" || echo "none"
            echo
            echo "### Failed cases"
            grep -E '^  FAIL ' "$RUNNER_TEMP/contract.log" || echo "none"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Server logs on failure
        if: failure()
        run: |
          tail -50 "$RUNNER_TEMP/rs.log" || true

  browser-gates:
    # DEBT-025: the served-page check (check-0402.mjs, 04-02's CSP/beacon/TTFC evidence) against
    # a hosted test-idp build. Playwright and its chromium come from npm here, not from the dev
    # box's ux-ui kit: the scripts accept PW_INDEX_MJS and PW_CHANNEL for exactly this.
    # continue-on-error until the first green run proves the job (then DEBT-025 discharges and
    # this flag goes).
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      VTV_SECRET_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and its chromium
        run: |
          npm init -y >/dev/null
          npm i --no-fund --no-audit playwright
          npx playwright install --with-deps chromium
      - run: cargo build -p hub-server --features test-idp
      - name: Start the hosted test-idp server
        run: |
          HUB_HTTP_PORT=8771 \
          HUB_STATIC_DIR="$PWD/hub" \
          HUB_LOG_DIR="$RUNNER_TEMP/logs" HUB_CACHE_DIR="$RUNNER_TEMP/cache" \
          AUTH_ENABLED=true \
          PUBLIC_ORIGIN="http://127.0.0.1:8771" \
          GOOGLE_CLIENT_ID="test-client.apps.googleusercontent.com" \
          GOOGLE_CLIENT_SECRET="test-secret" \
          GOOGLE_AUTH_URL="http://127.0.0.1:8771/__test-idp/authorize" \
          GOOGLE_TOKEN_URL="http://127.0.0.1:8771/__test-idp/token" \
          GOOGLE_JWKS_URL="http://127.0.0.1:8771/__test-idp/jwks" \
          GOOGLE_ISSUER="https://accounts.google.com" \
          ADMIN_EMAILS="owner@example.test" \
          VTV_TEST_IDP=1 \
          nohup target/debug/hub-server > "$RUNNER_TEMP/hub.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs "http://127.0.0.1:8771/api/status" > /dev/null && break
            sleep 1
          done
          curl -fs "http://127.0.0.1:8771/api/status" > /dev/null || { echo "server did not start"; tail -30 "$RUNNER_TEMP/hub.log"; exit 1; }
      - name: Served-page check (hosted mode, no reconnect, no local)
        env:
          PW_INDEX_MJS: playwright
          PW_CHANNEL: chromium
          CHECK_HOSTED: http://127.0.0.1:8771
          CHECK_RECONNECT: "0"
        run: node .paul/runs/check-0402.mjs
      - name: Server logs on failure
        if: failure()
        run: |
          tail -50 "$RUNNER_TEMP/hub.log" || true
