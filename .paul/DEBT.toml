note = "Bounded by the per-IP Api bucket (20/s, burst 40) and by single-user scope, so it is not a quota bypass an attacker can hold; it is a window, not a leak. The preventive form would be a count inside the insert's WHERE (a subquery the single-table SQL discipline allows only as a scalar subquery) or an ON CONFLICT-style guard — 05-ARCHITECTURE decision 4 chose corrective deliberately. This row exists so the choice is revisited with Q7 (the per-user byte quota) rather than forgotten. The check is deliberately NOT a grep of `if count > KEY_MAX`: that text is already in auth/mod.rs, so it would pass on day one and report the decision as taken when nothing was decided. D-026 is the id reserved for the revisit; until the row is written in DECISIONS.md this row stays due. 2026-11-25 repaired and discharged (06-04 task 4): the original check was vacuous — D-026 already existed as the unrelated phase-05 'no IndexedDB mirror' decision, so the grep returned 1 on day one and the row could never fail; the negative control confirmed the pass without the new decision. The check now reads D-031, the id genuinely reserved for the state-cap decision."

