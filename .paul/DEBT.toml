[[debt]]
id = "DEBT-012"
title = "pgsqlite 0.0.22 mis-maps UPDATE parameters when the placeholder numbers are out of text order (UPDATE t SET a = $2 WHERE id = $1 matched 0 rows and reported rows_affected 0; the same statement with sequential numbers matched and persisted). Worked around in S4 and S8; the fix belongs in ~/project/pgsqlite so future SQL need not obey this rule"
kind = "tech"
origin = "03-02 task 3 (measured with probes: UPDATE ... WHERE id = $1 after SET x = $2 hit 0 rows; renumbered, 1 row)"
owner = "owner"
trigger = "event:pgsqlite-param-order-fix"
status = "open"
check = { type = "command", run = "bash -c \"C:/Users/Dell/.local/bin/pgsqlite.exe --help 2>&1 | head -1 | grep -q 0.0.23 && echo ENGINE-PARAM-ORDER-FIXED || echo STILL-OLD-BUILD\"", expect = "ENGINE-PARAM-ORDER-FIXED" }
note = "The check reads the installed engine version: it passes when a build newer than 0.0.22 replaces the one that mis-maps parameters. S4 and S8 keep sequential placeholders until then (their comments say why). Also measured: UPDATE rows_affected on pgsqlite is not a usable signal for an unchanged row, so the sign-in effect checks S7 instead."

