[toolchain]
# Channel only: the host triple is a MACHINE property, never a repo property. Pinning the triple
# here (D-038's first cut) broke every Linux CI job - rustup on Ubuntu cannot install a
# x86_64-pc-windows-msvc host toolchain. The Windows-msvc default lives in rustup's
# default_host_tuple on the dev box instead (rustup set default-host), so a local build is msvc
# while Linux CI keeps resolving 1.95.0-x86_64-unknown-linux-gnu.
channel = "1.95.0"
components = ["clippy", "rustfmt"]
