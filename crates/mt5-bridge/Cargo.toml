[package]
name = "mt5-bridge"
version = "0.3.0"
description = "The MT5 bridge as one release binary: an MCP client to the terminal's built-in server and the four HTTPS routes the hub reads"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tower.workspace = true
subtle.workspace = true
dotenvy.workspace = true

[dev-dependencies]
# Key order is part of the contract (rule 5); preserve_order makes json! serialize as written.
serde_json = { workspace = true, features = ["preserve_order"] }
