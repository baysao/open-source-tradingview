[package]
name = "mt5-bridge"
version = "0.3.0"
description = "The MT5 bridge as one release binary: an MCP client to the terminal's built-in server and the four HTTPS routes the hub reads"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
# Key order is contract rule 5/6 on every route; preserve_order makes json!/Map serialize as written (hub-core's placement).
serde_json = { workspace = true, features = ["preserve_order"] }
chrono.workspace = true
tower.workspace = true
subtle.workspace = true
dotenvy.workspace = true

