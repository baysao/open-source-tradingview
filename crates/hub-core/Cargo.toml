[package]
name = "hub-core"
version = "0.1.0"
description = "TradeX hub server as a library: one router (hub_core::app) for every host"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hub-types.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tracing.workspace = true
lru.workspace = true
percent-encoding.workspace = true
regex.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
hmac.workspace = true
hkdf.workspace = true
getrandom.workspace = true
subtle.workspace = true
rsa = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[features]
# Test support (Phase 03): down migrations and, from 03-02, the local identity provider.
# Never enabled in a release build (CI asserts the feature tree).
test-idp = ["dep:rsa", "dep:rand"]

[dev-dependencies]
# Tests compare key order with Python (order-flow goldens); feature-unified into test builds only.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
tempfile.workspace = true

[[test]]
name = "db_engines"
required-features = ["test-idp"]

[[test]]
name = "auth"
required-features = ["test-idp"]

[[test]]
name = "admin"
required-features = ["test-idp"]

[[test]]
name = "gate"
required-features = ["test-idp"]

[[test]]
name = "state"
required-features = ["test-idp"]

[[test]]
name = "state_routes"
required-features = ["test-idp"]


