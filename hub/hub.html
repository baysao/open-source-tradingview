  .notice { position:fixed; top:var(--notice-top); left:50%; transform:translateX(-50%); z-index:55; display:grid;

  dialog#authDel { width:min(var(--dlg-w), 94vw); padding:var(--dlg-pad); background:var(--panel); color:var(--text);

  dialog#authDel::backdrop { background:color-mix(in srgb, var(--bg) 78%, transparent) }
  dialog#authDel:modal { overscroll-behavior:contain }

    background:var(--bg); color:var(--text); line-height:1.45 }

</style></head><body>
<div id="app">
<div id="syncNotices" role="region" aria-label="Sync notices"></div>
<header id="bar">
  <div id="barScroll">
  <h1 id="brand">TradeX</h1><span class="sep"></span>
  <div id="pick"><input id="q" spellcheck="false" autocomplete="off" placeholder="Search instrument"><div id="list" hidden></div></div>
  <div class="seg" id="brokers" title="Broker: same instrument, different price source"></div>
  <select id="variant" title="Market type at this broker" hidden></select>
  <span id="ticker"></span><span class="sep"></span>
  <div class="seg" id="tfs"></div><span class="sep"></span>
  <select id="layout" title="Chart layout (Vela)" aria-label="Chart layout"><option value="">1 chart</option><option value="2h">2 side by side</option><option value="2v">2 stacked</option><option value="4">4 charts</option><option value="8">8 charts</option></select>
  <span class="sep"></span>
  <div class="seg" id="engines" title="Chart engine"></div>
  </div>
  <span id="authSlot"></span>
</header>
<main id="stage"><iframe id="frame" title="chart"></iframe><div id="cover" hidden><div id="coverText"></div></div></main>
<aside id="dock" hidden></aside>
<nav id="rail" aria-label="Panels">
  <button data-panel="indicators" title="Indicators, metrics, and strategies ( / )" aria-label="Indicators, metrics, and strategies"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17l5-6 4 4 4-7 5 6"/><path d="M3 21h18"/></svg></button>
  <button data-panel="pine" title="Pine Editor: write, import and add your own Pine scripts" aria-label="Pine Editor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg></button>
  <button data-panel="feeds" title="Feeds: broker connection status" aria-label="Feeds: broker connection status"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 14a8 8 0 0 1 12 0M5.5 11.5a4.5 4.5 0 0 1 7 0"/><circle cx="9" cy="14.5" r="1.2" fill="currentColor"/></svg></button>
  <button data-panel="settings" title="Settings: theme, colours, font" style="margin-top:auto;margin-bottom:var(--rail-top)" aria-label="Settings: theme, colours, font"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</nav>
<footer id="status"><span id="lights"></span><button id="restart" title="Restart this chart. For Remote MT5: reconnects the SSH link and, if configured, restarts the bridge. Drawings on the chart are cleared.">Restart chart</button><span id="restartMsg"></span><span id="hud"></span><span id="clock"></span><span id="legal"><a href="privacy.html">Privacy</a> <a href="notices.html">Notices</a></span></footer>
</div>
<script src="pine_convert.js"></script><script src="pine_style.js"></script><script src="ind_core.js"></script><script src="ind_dialog.js"></script><script src="pine_editor.js"></script>
<script>
// TradeX: one shell over every broker and every chart engine.
// Broker switch keeps the instrument (gold stays gold); engine switch keeps instrument, broker and timeframe.
const ENGINES = [["vela", "Vela"], ["lightweight", "Lightweight"], ["klinechart", "KLineChart"]];
const TFS = [["M1", "1m"], ["M5", "5m"], ["M15", "15m"], ["M30", "30m"], ["H1", "1H"], ["H4", "4H"], ["D1", "D"]];
const SHORT = { arm: "RMT", bybit: "BYB", deriv: "DER", mt5: "MT5", binance: "BIN" };
const $ = (id) => document.getElementById(id);
let DATA = { brokers: [], instruments: [] }, BY_TICKER = new Map(), status = {};
let st = { engine: "vela", key: "XAUUSD", broker: "deriv", ticker: "frxXAUUSD", tf: "M1" };
try { Object.assign(st, JSON.parse(localStorage.getItem("chartHub") || "{}")); } catch (_) {}
const save = () => { try { localStorage.setItem("chartHub", JSON.stringify(st)); } catch (_) {} };
const inst = (k) => DATA.instruments.find((i) => i.key === k);

async function init() {
  DATA = await (await fetch("/api/instruments")).json();
  DATA.instruments.forEach((i) => Object.entries(i.brokers).forEach(([b, opts]) => opts.forEach((o) => BY_TICKER.set(o.ticker, { key: i.key, broker: b }))));
  if (!inst(st.key) || !inst(st.key).brokers[st.broker]) Object.assign(st, { key: "XAUUSD", broker: "deriv", ticker: "frxXAUUSD" });
  ENGINES.forEach(([id, n]) => $("engines").appendChild(btn(n, () => { st.engine = id; save(); paint(); loadEngine(); }, id)));
  TFS.forEach(([id, n]) => $("tfs").appendChild(btn(n, () => { st.tf = id; push(); }, id)));
  DATA.brokers.forEach((b) => { const x = btn("", () => chooseBroker(b.id), b.id); x.innerHTML = `<span class="dot"></span>${b.name}`; $("brokers").appendChild(x); });
  $("restart").onclick = restartChart;
  pollStatus(); setInterval(pollStatus, 10000);
  paint(); loadEngine();
}
function btn(text, fn, id) { const b = document.createElement("button"); b.textContent = text; b.dataset.id = id; b.onclick = fn; return b; }

// Cover the chart while a switch is in flight, so a new label never sits on old candles.
// A chart that cannot load keeps trying by itself every 15 s; the Restart button in the status bar forces it.
let pending = null, coverTimer = null, coverRetry = null;
function retryLoad() { clearTimeout(coverRetry); coverRetry = setTimeout(() => { if (pending) loadEngine(); }, 15000); }
function cover(ticker) {
  pending = ticker; clearTimeout(coverTimer); clearTimeout(coverRetry);
  $("coverText").textContent = `Loading ${ticker} ...`; $("cover").hidden = false;
  coverTimer = setTimeout(() => { if (pending) { $("coverText").textContent = `${ticker}: no candles after 20 s. Trying again by itself; or press Restart chart below.`; retryLoad(); } }, 20000);
}
// Restart button: every feed reconnects when the chart reloads.
async function restartChart() {
  const b = $("restart"), msg = $("restartMsg"); b.disabled = true;
  try {
    msg.textContent = "Reconnecting ...";
    loadEngine(); pollStatus();
  } catch (e) { msg.textContent = "Chart server not answering: run start.bat (Windows) or start.sh"; }
  b.disabled = false; setTimeout(() => { msg.textContent = ""; }, 15000);
}
function loadEngine() {
  cover(st.ticker);
  $("layout").value = "";  // a freshly loaded engine starts with one chart
  reapply = true; liveIds = {};
  $("frame").src = `${st.engine}.html?symbol=${encodeURIComponent(st.ticker)}&tf=${st.tf}&embed=1`;
}
// Switch inside the running engine (Vela keeps its indicators and drawings).
function push() {
  save(); paint();
  const w = $("frame").contentWindow;
  cover(st.ticker);
  if (w && w.labChart && w.labChart.setMarket) w.postMessage({ cmd: "set", symbol: st.ticker, tf: st.tf }, location.origin);
  else loadEngine();
}
function chooseInstrument(k) {
  const i = inst(k); if (!i) return;
  const order = [st.broker, ...DATA.brokers.map((b) => b.id)];
  const b = order.find((x) => i.brokers[x]);
  Object.assign(st, { key: k, broker: b, ticker: i.brokers[b][0].ticker });
  push();
}
function chooseBroker(b) {
  const i = inst(st.key); if (!i || !i.brokers[b]) return;
  Object.assign(st, { broker: b, ticker: i.brokers[b][0].ticker });
  push();
}

function paint() {
  const i = inst(st.key);
  if (document.activeElement !== $("q")) $("q").value = i ? `${i.key}  ${i.name}` : st.ticker;
  $("engines").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === st.engine));
  $("layout").disabled = st.engine !== "vela"; if (st.engine !== "vela") $("layout").value = "";
  $("tfs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === st.tf));
  $("brokers").querySelectorAll("button").forEach((b) => {
    const has = !!(i && i.brokers[b.dataset.id]), s = status[b.dataset.id];
    b.disabled = !has; b.classList.toggle("on", b.dataset.id === st.broker);
    b.title = (has ? "" : "Not offered by this broker. ") + (s ? s.msg : "");
    b.querySelector(".dot").className = "dot" + (s ? (s.ok ? " ok" : " bad") : "");
  });
  const opts = (i && i.brokers[st.broker]) || [];
  const v = $("variant"); v.hidden = opts.length < 2; v.innerHTML = "";
  opts.forEach((o) => v.add(new Option(o.label || o.ticker, o.ticker)));
  v.value = st.ticker;
  $("ticker").textContent = st.ticker;
}
$("variant").onchange = (e) => { st.ticker = e.target.value; push(); };

// Instrument search
let hits = [], hi = 0;
function search() {
  const q = $("q").value.trim().toUpperCase(), words = q.split(/\s+/).filter(Boolean);
  hits = DATA.instruments.filter((i) => words.every((w) => i.key.includes(w) || i.name.toUpperCase().includes(w))).slice(0, 150);
  hi = 0; const L = $("list"); L.innerHTML = "";
  hits.forEach((i, n) => {
    const d = document.createElement("div"); if (n === 0) d.className = "hi";
    d.innerHTML = `<b></b><span></span><i></i>`;
    d.children[0].textContent = i.key; d.children[1].textContent = i.name;
    d.children[2].textContent = Object.keys(i.brokers).map((b) => SHORT[b]).join(" ");
    d.onmousedown = (e) => { e.preventDefault(); pick(i.key); };
    L.appendChild(d);
  });
  const r = $("q").getBoundingClientRect(); L.style.left = r.left + "px"; L.hidden = !hits.length;
}
function pick(k) { $("list").hidden = true; $("q").blur(); chooseInstrument(k); }
$("q").onfocus = () => { $("q").select(); $("q").value = ""; search(); };
$("q").oninput = search;
$("q").onblur = () => { $("list").hidden = true; paint(); };
$("q").onkeydown = (e) => {
  const rows = $("list").children;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!rows.length) return;
    rows[hi].className = ""; hi = (hi + (e.key === "ArrowDown" ? 1 : rows.length - 1)) % rows.length;
    rows[hi].className = "hi"; rows[hi].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter" && hits[hi]) pick(hits[hi].key);
  else if (e.key === "Escape") $("q").blur();
};

// The engine reports symbol/timeframe changes made inside it, so the shell stays in step.
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.evt === "loaded") {
    if (e.data.symbol !== pending) return;
    if (e.data.error) { $("coverText").textContent = `${pending}: ${e.data.error}. Trying again by itself; or press Restart chart below.`; retryLoad(); return; }
    pending = null; clearTimeout(coverTimer); clearTimeout(coverRetry); $("cover").hidden = true;
    if (reapply) { reapply = false; reapplyAll(); for (const k in CAT) if (k.startsWith("vela:")) delete CAT[k]; indChanged(); }  // a fresh engine: put the saved indicators back
    return;
  }
  if (e.data.evt === "pine") { onPineResult(e.data); return; }
  if (e.data.evt === "reply") { onReply(e.data); return; }
  if (e.data.evt === "indicators:open") { openIndDlg(); return; }
  if (e.data.evt === "ind:removed") { onLegendRemoved(e.data.id); return; }
  if (e.data.evt === "ind:inputs") { onInputs(e.data); return; }
  if (e.data.evt === "ind:ready") { onReady(e.data); return; }
  if (e.data.evt === "hud") { $("hud").textContent = e.data.text; return; }
  if (e.data.evt !== "market") return;
  const { symbol, tf } = e.data; if (!symbol) return;
  if (symbol === st.ticker && (!tf || tf === st.tf)) return;  // our own switch echoed back
  const m = BY_TICKER.get(symbol);
  if (m) Object.assign(st, { key: m.key, broker: m.broker });
  else st.key = symbol;  // a symbol outside the instrument map: shown raw
  st.ticker = symbol; if (tf) st.tf = tf;
  save(); paint();
});

async function pollStatus() {
  try { status = await (await fetch("/api/status")).json(); }
  catch (_) { status = Object.fromEntries(DATA.brokers.map((b) => [b.id, { ok: false, msg: "chart server not answering" }])); }
  paint(); paintStatus();
}
function paintStatus() {
  const L = $("lights"); L.innerHTML = "";
  DATA.brokers.forEach((b) => { const s = status[b.id] || {}, x = document.createElement("span");
    x.innerHTML = `<span class="dot ${s.ok ? "ok" : "bad"}"></span>${SHORT[b.id]}`; x.title = `${b.name}: ${s.msg || ""}`; x.style.marginRight = "10px"; L.appendChild(x); });
  if (openPanel === "feeds") renderFeeds();
}

// ---- Dock panels (right side). Each panel is one render function; more plug in here later. ----
const PANELS = { feeds: renderFeeds, settings: renderSettings, pine: renderPine };

// ---- Settings: theme preset, font, candle and interface colours. Saved for every engine; applied live. ----
function themeChanged() {
  HubThemeApply();
  const w = $("frame").contentWindow; if (w) w.postMessage({ cmd: "theme" }, location.origin);
  renderSettings();
}
function renderSettings() {
  const s = HubSettingsLoad(), t = HubTheme, d = $("dock");
  d.innerHTML = "<h3>Settings</h3>";
  const sec = (title) => { const x = document.createElement("div"); x.className = "set"; x.innerHTML = `<h4>${title}</h4>`; d.appendChild(x); return x; };
  const pre = sec("Theme"), row = document.createElement("div"); row.className = "presets"; pre.appendChild(row);
  Object.entries(HubPresets).forEach(([k, p]) => { const b = document.createElement("button"); b.textContent = p.label;
    b.style.cssText = `background:${p.bg};color:${p.text};border-color:${p.line}`; b.className = s.preset === k ? "on" : "";
    b.onclick = () => { HubSettingsSave({ ...s, preset: k, overrides: {} }); themeChanged(); }; row.appendChild(b); });
  const fs = sec("Font"), sel = document.createElement("select"); fs.appendChild(sel);
  Object.entries(HubFonts).forEach(([k, f]) => sel.add(new Option(f.label, k))); sel.value = s.font;
  sel.onchange = () => { HubSettingsSave({ ...s, font: sel.value }); themeChanged(); };
  const colors = (title, items) => { const x = sec(title);
    items.forEach(([key, label]) => { const l = document.createElement("label"), i = document.createElement("input");
      i.type = "color"; i.value = t[key]; l.append(label, i); x.appendChild(l);
      i.oninput = () => { const cur = HubSettingsLoad(); cur.overrides[key] = i.value; HubSettingsSave(cur); HubThemeApply();
        const w = $("frame").contentWindow; if (w) w.postMessage({ cmd: "theme" }, location.origin); }; });
    return x; };
  const cs = colors("Candles", [["up", "Rising candle"], ["down", "Falling candle"]]);
  const ib = document.createElement("label"), ibx = document.createElement("input"); ibx.type = "checkbox"; ibx.checked = s.indicatorBars;
  ib.append("Let indicators recolour candles", ibx); ib.title = "Off: your two colours always win. On: an indicator using Pine barcolor() may paint candle bodies."; cs.appendChild(ib);
  ibx.onchange = () => { HubSettingsSave({ ...HubSettingsLoad(), indicatorBars: ibx.checked }); loadEngine(); };  // indicators re-run with the new rule
  const ui = colors("Interface", [["bg", "Chart background"], ["panel", "Panels and bars"], ["text", "Text"], ["dim", "Secondary text"], ["line", "Borders"], ["grid", "Grid lines"], ["accent", "Accent (selection, price)"]]);
  const r = document.createElement("button"); r.className = "reset"; r.textContent = "Reset colours to theme";
  r.onclick = () => { HubSettingsSave({ ...HubSettingsLoad(), overrides: {} }); themeChanged(); }; ui.appendChild(r);
}
let openPanel = null;
function renderFeeds() {
  const d = $("dock"); d.innerHTML = "<h3>Feeds</h3>";
  DATA.brokers.forEach((b) => { const s = status[b.id] || {}, r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<b><span class="dot ${s.ok ? "ok" : "bad"}"></span></b><span></span>`;
    r.children[0].append(b.name); r.children[1].textContent = s.msg || "-"; d.appendChild(r); });
}
function openPanelByName(name) {
  openPanel = name;
  document.querySelectorAll("#rail button").forEach((x) => x.classList.toggle("on", x.dataset.panel === openPanel));
  $("dock").classList.remove("wide"); $("dock").hidden = !openPanel; if (openPanel) PANELS[openPanel]();
}
document.querySelectorAll("#rail button").forEach((b) => (b.onclick = () => {
  if (b.dataset.panel === "indicators") return openIndDlg();  // TradingView-style dialog, not a dock panel
  openPanelByName(openPanel === b.dataset.panel ? null : b.dataset.panel);
}));
// "/" opens the Indicators dialog (TradingView's shortcut) when not typing.
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("indDlg") && !$("indDlg").hidden) { closeIndDlg(); return; } if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openIndDlg(); } });

// Layout (Vela only): the engine rebuilds its grid on the current market.
$("layout").onchange = (e) => { const w = $("frame").contentWindow; if (w) w.postMessage({ cmd: "layout", layout: e.target.value }, location.origin); };

// UTC clock in the status bar (all market times in this project are UTC).
setInterval(() => { $("clock").textContent = new Date().toISOString().slice(11, 19) + " UTC"; }, 1000);
init();
</script>
